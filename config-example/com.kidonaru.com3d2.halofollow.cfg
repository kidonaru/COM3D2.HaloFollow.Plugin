## Settings file was created by plugin COM3D2.HaloFollow.Plugin v0.1.0.0
## Plugin GUID: com.kidonaru.com3d2.halofollow

[Detection]

## 1 フレームでこれ以上（cm）頭が動き、その速さが毎秒 300 cm を超えたら瞬間移動として即座に合わせる
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 200
TeleportDistanceCm = 20

## 1 フレームでこれ以上（度）頭が回り、その速さが毎秒 1000 度を超えたら瞬間移動として即座に合わせる
# Setting type: Single
# Default value: 45
# Acceptable value range: From 1 to 180
TeleportAngle = 45

## 一時停止中にモーション時刻がこの秒数以下だけ進んだらコマ送りとして追従を進める。超えたらシーク
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.01 to 1
FrameStepMax = 0.25

## 再生中にモーション時刻が想定よりこの秒数以上進んだらシークとみなす
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.01 to 1
SeekTolerance = 0.1

[General]

## ヘイロー追従全体の有効化。無効にすると通常の頭への固定追従に戻る（メイドごとの設定は変わらない）
# Setting type: Boolean
# Default value: true
Enabled = true

## 設定ウィンドウの表示切替キー
# Setting type: KeyboardShortcut
# Default value: H + LeftShift + LeftControl
WindowShortcut = H + LeftShift + LeftControl


