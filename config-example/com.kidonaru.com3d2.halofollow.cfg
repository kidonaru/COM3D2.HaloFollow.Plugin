## Settings file was created by plugin COM3D2.HaloFollow.Plugin v0.1.0.0
## Plugin GUID: com.kidonaru.com3d2.halofollow

[Detection]

## この移動速度（cm/秒）未満が続くと静止とみなす
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 20
StillLinearSpeedCm = 1

## 静止中にこの移動速度（cm/秒）を超えると動作とみなす
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 50
MoveLinearSpeedCm = 3

## この回転速度（度/秒）未満が続くと静止とみなす
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 90
StillAngularSpeed = 5

## 静止中にこの回転速度（度/秒）を超えると動作とみなす
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 180
MoveAngularSpeed = 15

## 静止とみなすまでに必要な継続時間（秒）
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
StillDelay = 0.5

## 1 フレームでこれ以上（cm）頭が動いたら瞬間移動として即座に合わせる
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 200
TeleportDistanceCm = 20

## 1 フレームでこれ以上（度）頭が回ったら瞬間移動として即座に合わせる
# Setting type: Single
# Default value: 45
# Acceptable value range: From 1 to 180
TeleportAngle = 45

## 一時停止中にモーション時刻がこの秒数以下だけ進んだらコマ送りとして追従を進める。超えたらシーク
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.01 to 1
FrameStepMax = 0.25

## 再生中にモーション時刻が想定よりこの秒数以上進んだらシークとみなす
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.01 to 1
SeekTolerance = 0.1

[General]

## ヘイロー追従全体の有効化。無効にすると通常の頭への固定追従に戻る
# Setting type: Boolean
# Default value: true
Enabled = true

## 設定ウィンドウの表示切替キー
# Setting type: KeyboardShortcut
# Default value: H + LeftShift + LeftControl
WindowShortcut = H + LeftShift + LeftControl

## 追従させる装備のモデル名または menu 名を | 区切りで並べる（大文字小文字は区別しない）
# Setting type: String
# Default value: natu_halo.model
Targets = natu_halo.model

[Target.natu_halo.model]

## この対象の追従を有効にする
# Setting type: Boolean
# Default value: true
Enabled = true

## モデルが頭に付くためのボーン名。このボーンは動かさず、追従専用の複製へ差し替える
# Setting type: String
# Default value: Headset
BoneName = Headset

## 位置の遅れ追従を有効にする
# Setting type: Boolean
# Default value: true
PositionFollow = true

## 位置の追従時間（秒）。0 で即時追従
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
PositionTime = 0.1

## 回転の遅れ追従を有効にする
# Setting type: Boolean
# Default value: true
RotationFollow = true

## 回転の追従時間（秒）。0 で即時追従
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
RotationTime = 0.1

## 本来の位置からの最大ずれ（cm）。遅れと浮遊を合成した結果にかかる
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 10
MaxPositionOffsetCm = 3

## 本来の角度からの最大ずれ（度）
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 45
MaxAngle = 10

## 基準位置の追加オフセット（cm、ボーンのローカル軸）
