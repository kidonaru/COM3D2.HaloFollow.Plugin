# Default value: {"x":0.0,"y":0.0,"z":0.0}
OffsetPositionCm = {"x":0.0,"y":0.0,"z":0.0}

## 基準角度の追加オフセット（度、ボーンのローカル軸のオイラー角）
# Setting type: Vector3
# Default value: {"x":0.0,"y":0.0,"z":0.0}
OffsetRotation = {"x":0.0,"y":0.0,"z":0.0}

## 静止中の上下浮遊を有効にする
# Setting type: Boolean
# Default value: true
FloatEnabled = true

## 浮遊の振幅（cm、片側）。0 で浮遊なし
